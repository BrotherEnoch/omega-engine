# crates/omega-loss-attribution/Cargo.toml
[package]
name    = "omega-loss-attribution"
version = "12.0.0"
edition = "2021"

[dependencies]
omega-core = { path = "../omega-core" }

# NOTE: omega-gas-war is NOT a dependency here.
# Per §22.1: omega-loss-attribution ← omega-gas-war (not the reverse).
# The gas model multipliers ARE part of this crate's domain, but the
# Gas War Engine (omega-gas-war) consumes this crate's output —
# omega-loss-attribution must not depend on omega-gas-war.

# EVM primitive types — blueprint_hash is B256, not [u8; 32]
alloy-primitives = { workspace = true }

# Serialisation — ModelCheckpoint bincode, LossEvent serde
serde      = { workspace = true }
serde_json = { workspace = true }
bincode    = { workspace = true }

# Timestamps — LossEvent, ModelCheckpoint
chrono = { workspace = true }

# Error handling
anyhow    = { workspace = true }
thiserror = { workspace = true }

# Telemetry
tracing = { workspace = true }

# PRNG — deterministic holdout split uses blueprint_hash[0] % 5 (no rand needed)
# rand is NOT required here; the holdout split is deterministic from the hash.

[dev-dependencies]
tempfile = "3"