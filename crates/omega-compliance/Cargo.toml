# crates/omega-compliance/Cargo.toml
[package]
name    = "omega-compliance"
version = "12.0.0"
edition = "2021"

[dependencies]
omega-core = { path = "../omega-core" }

# Error handling
anyhow    = { workspace = true }
thiserror = { workspace = true }

# Serialisation
serde      = { workspace = true }
serde_json = { workspace = true }

# Telemetry
tracing = { workspace = true }

# Timestamps
chrono = { workspace = true }

# Concurrency (better than std RwLock for this use)
parking_lot = "0.12"

[dev-dependencies]
alloy-primitives = { workspace = true }