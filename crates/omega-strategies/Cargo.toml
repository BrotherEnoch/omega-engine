# crates/omega-strategies/Cargo.toml
[package]
name    = "omega-strategies"
version = "12.0.0"
edition = "2021"

# ## Audit fix (earlier revision)
#
# Added `uuid` — sa.rs/la.rs/msa.rs/mev.rs each generate a `signal_id`
# via `Uuid::new_v4()` in `build_blueprint` now that
# `ExecutionBlueprint` (omega-core) has that field; cnry.rs's test
# module also constructs one. Not previously a dependency of this crate.
#
# Added `omega-flashloan` — la.rs's `build_blueprint` now calls
# `omega_flashloan::select_provider` and `LaStrategy::new` takes an
# `Arc<LiquidityRegistry>`, both real (not trait-object) dependencies on
# this crate's types. This is a deliberate departure from the
# §22.1 "injected as trait objects" architecture note below — flagged
# here rather than silently contradicting that note. See la.rs's own
# module comment for the reasoning.
#
# ## Real position selection (this revision)
#
# Added `omega-positions` — `LaStrategy::new` now also takes an
# `Arc<omega_positions::PositionRegistry>`, read directly (not injected
# as a trait object) on every `score`/`build_blueprint` call to select
# the current most-urgent liquidatable position. Same real, not-a-trait-
# object dependency shape as `omega-flashloan` above, for the same
# reason: `PositionRegistry` is a concrete, DashMap-backed shared
# registry (mirroring `LiquidityRegistry`'s own shape — see that crate's
# doc comment), not a domain abstraction that benefits from being
# injected behind a trait the way the oracle/risk crates are. Same
# deliberate departure from the §22.1 note below as `omega-flashloan`
# already represents — not a new precedent, an extension of the one
# already flagged.
#
# ## Competition model (this revision)
#
# Added `omega-risk` — sa.rs's `score()` now calls
# `omega_risk::competition::non_la_competition_probability()` to derive a
# live, MEV-Share-adjusted competition estimate rather than a hardcoded
# 0.35 constant. This is the third deliberate departure from the §22.1
# "injected as trait objects" note below. The competition model is a pure
# function (stateless, no I/O) — injecting it behind a trait would add
# indirection with no benefit; it is cheaper and clearer to call it
# directly. omega-risk already compiles without omega-strategies in its
# dependency graph (the direction of that dependency has not changed), so
# this addition creates no cycle.

[dependencies]
omega-core             = { path = "../omega-core" }
omega-gas-war           = { path = "../omega-gas-war" }
omega-loss-attribution  = { path = "../omega-loss-attribution" }
omega-flashloan         = { path = "../omega-flashloan" }
omega-positions         = { path = "../omega-positions" }
omega-risk              = { path = "../omega-risk" }

# ARCHITECTURAL NOTE (§22.1):
# omega-strategies originally depended only on omega-core, omega-gas-war,
# and omega-loss-attribution. omega-oracle and the remaining risk/rpc
# crates are still injected as trait objects so omega-strategies stays
# compilable without the full dependency tree. The three real (non-trait-
# object) additions — omega-flashloan, omega-positions, omega-risk — are
# each flagged in the audit notes above rather than smoothed over. The
# §22.1 constraint is partially relaxed, not abandoned: oracle data and
# RPC access remain injected as traits; only concrete shared-registry and
# pure-function dependencies are wired directly.

# EVM primitive types (shared with omega-core — no full alloy transport)
alloy-primitives = { workspace = true }

# In-process EVM execution (revm simulator, §4)
revm = { workspace = true }

# Async runtime
tokio        = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }

# Error handling
anyhow    = { workspace = true }
thiserror = { workspace = true }

# Serialisation
serde      = { workspace = true }
serde_json = { workspace = true }

# Telemetry
tracing = { workspace = true }

# Timestamps (blueprint construction time, nonce sequencing)
chrono = { workspace = true }

# Concurrent structures (sequencer restart handler, §11.3)
dashmap  = { workspace = true }
arc-swap = { workspace = true }

# PRNG (cascade relay order randomisation, §11.2)
rand = { workspace = true }

# ExecutionBlueprint::signal_id generation in build_blueprint (sa/la/msa/mev)
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }