# crates/omega-address-rotation/Cargo.toml
[package]
name    = "omega-address-rotation"
version = "12.0.0"
edition = "2021"

[dependencies]
omega-core              = { path = "../omega-core" }
omega-gas-war           = { path = "../omega-gas-war" }

# LossCode is used by pattern_detector.rs and rotation.rs to classify loss
# events for the fingerprinting pattern detector (§14).
# omega-loss-attribution depends on omega-core + omega-gas-war; no cycle.
omega-loss-attribution  = { path = "../omega-loss-attribution" }

# Error handling
anyhow    = { workspace = true }
thiserror = { workspace = true }

# Serialisation — rotation records, reputation snapshots
serde      = { workspace = true }
serde_json = { workspace = true }

# Telemetry
tracing = { workspace = true }

# PRNG — randomised relay ordering within tie-band (§14.2, fix I2)
rand = { workspace = true }

# Timestamps — rotation scheduling and reputation snapshot timestamps
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"