# crates/omega-zk/Cargo.toml
[package]
name    = "omega-zk"
version = "12.0.0"
edition = "2021"

[dependencies]
omega-core = { path = "../omega-core" }

# Async runtime
tokio            = { version = "1", features = ["full", "rt-multi-thread", "sync", "time", "macros"] }
tokio-stream     = "0.1"

# ZK / cryptography — T1 software prover baseline (spec: prover_tier = "t1_software")
winterfell       = "0.7"
sha3             = "0.10"
hex              = "0.4"
rand             = "0.8"

# Error handling
anyhow           = "1"
thiserror        = "1"

# Logging
tracing          = "0.1"

# Serialization
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
bincode          = "1"

# Concurrency / lock-free
crossbeam-channel = "0.5"
crossbeam-queue  = "0.3"
dashmap          = "5"
parking_lot      = "0.12"
arc-swap         = "1"

# Metrics
prometheus       = "0.13"
once_cell        = "1"

futures          = "0.3"

# Time
chrono           = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util", "time"] }