# crates/omega-rpc/Cargo.toml
[package]
name    = "omega-rpc"
version = "12.0.0"
edition = "2021"

[dependencies]
omega-core   = { path = "../omega-core" }
omega-health = { path = "../omega-health" }

# ─────────────────────────────────────────────────────────────────
# ALLOY — Full transport stack (ONLY PERMITTED HERE per §22.1)
#
# omega-core uses alloy-primitives only; all transport surface
# is confined to this crate.
#
# Required features:
#   providers      — Provider trait, ProviderBuilder
#   provider-ws    — FIX (this revision): wires WS support INTO
#                     ProviderBuilder itself (ProviderBuilder::on_ws,
#                     and alloy::providers::WsConnect re-exported from
#                     alloy-provider's own `ws` feature). Distinct from
#                     `transport-ws` below, despite the similar name —
#                     confirmed directly against this workspace's pinned
#                     alloy 0.3.6 source: `transport-ws` only enables the
#                     umbrella's `alloy::transports::ws` re-export of the
#                     standalone `alloy_transport_ws` crate; it does NOT
#                     forward into alloy-provider's own `ws` feature,
#                     which is what actually gates
#                     `pub async fn on_ws(...)` and
#                     `pub use alloy_rpc_client::WsConnect;` inside
#                     alloy-provider-0.3.6/src/{builder,lib}.rs. Without
#                     this feature, `ProviderBuilder::on_ws` and
#                     `alloy::providers::WsConnect` do not exist at all
#                     (E0599 / E0432) — this was the root cause of
#                     client.rs's WS-connect failure this session, not a
#                     bug in client.rs's own code once this feature is
#                     enabled.
#   transport-ws   — WsConnect WebSocket transport (standalone
#                     alloy_transport_ws re-export at
#                     alloy::transports::ws — kept alongside
#                     provider-ws since other code in this crate may
#                     reference the transport module directly; not
#                     itself sufficient for ProviderBuilder::on_ws, see
#                     provider-ws above)
#   pubsub         — PubSubFrontend for eth_subscribe streams
#   rpc-types      — Block, Transaction, Filter, Log structs
#   rpc-types-eth  — Ethereum-specific types (eth_call, eth_blockNumber)
#   contract       — for ABI-decoded log parsing (lending protocol events)
# ─────────────────────────────────────────────────────────────────
alloy = { workspace = true, features = [
    "providers",
    "provider-ws",
    "transport-ws",
    "pubsub",
    "rpc-types",
    "rpc-types-eth",
    "contract",
] }

# Async runtime
tokio        = { workspace = true }
tokio-stream = { workspace = true }
futures      = { workspace = true }

# Error handling
anyhow    = { workspace = true }
thiserror = { workspace = true }

# Serialisation
serde      = { workspace = true }
serde_json = { workspace = true }

# Telemetry
tracing = { workspace = true }

# EVM primitive types (addresses, B256 — shared with omega-core)
alloy-primitives = { workspace = true }

# Concurrent metrics / rate limiter state
dashmap = { workspace = true }

# Timestamps on block header events
chrono = { workspace = true }

# HTTP client for MEV-Share SSE stream (§subscriptions run_mev_share_stream)
# Streaming body support required — do NOT enable default-features (pulls in
# native-tls which conflicts with the node deployment environment).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }