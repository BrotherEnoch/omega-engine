# omega-engine\crates\omega-testnet\Cargo.toml
[package]
name = "omega-testnet"
version = "0.1.0"
edition = "2021"
description = "Testnet dry-run layer for omega-engine: config, reporting, and phase-gate criteria tracking for Phase 0.75 (real relay, testnet funds). Contains no relay-submission or signing code."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"