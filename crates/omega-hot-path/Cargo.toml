# crates/omega-hot-path/Cargo.toml
[package]
name    = "omega-hot-path"
version = "12.0.0"
edition = "2021"

# omega-hot-path is the <1ms execution lane for SA (Phase 1 Microtx) and
# LA hot-tier (HF < 1.01, §11.1).  It owns:
#   - HotPathGate: admission control — only hot_path_eligible blueprints enter
#   - MicrotxSimulator: in-process revm wrapper, <1ms target latency
#   - HotPathMetrics: latency histogram, slot utilisation, EV tracking
#
# Dependency graph (§22.1):
#   omega-hot-path ← omega-core, omega-risk, omega-zk
#
# NOTE: omega-zk is NOT listed here because hot-path blueprints do not
# require ZK proofs before relay submission (the ZK gate is at the Vault
# level, not the submission level).  omega-hot-path is intentionally
# dependency-minimal to keep compile times low.
#
# ## Audit fix (this revision): omega-risk dependency
#
# Added `omega-risk`, path-dependency style matching `omega-core` below.
# `crates/omega-hot-path/src/simulator.rs` now calls
# `omega_risk::checks::{oracle_freshness_check, oracle_hierarchy_check,
# oracle_price_sanity_check, slippage_check}` and uses
# `omega_risk::context::{OracleSnapshot, MAX_SLIPPAGE_BPS_SA, ...}` to run
# oracle-freshness, price-sanity, and slippage checks before the hot path
# can report a successful simulation — see that file's own audit note for
# the full reasoning. Without this dependency, `simulator.rs` does not
# compile. This crate remains dependency-minimal otherwise; `omega-risk`
# itself has no dependency on `omega-zk`/`omega-relay`/other heavier
# crates, so this does not reintroduce the compile-time concern the
# module doc comment above otherwise guards against with the omega-zk
# exclusion.
#
# ## Audit fix (this revision): lint enforcement + uuid
#
# `[lints]` added below. `unwrap_used`/`expect_used` are set to "warn",
# not "deny", pending an actual sweep of this crate's existing code for
# unwrap/expect call sites — flipping straight to "deny" without first
# auditing what's there risks silently failing `cargo clippy` on code
# nobody has reviewed for it yet. Escalate to "deny" once that sweep is
# done and any remaining unwrap/expect calls are either removed or have
# a justified `#[allow(...)]` with a comment explaining why the
# invariant holds. `unsafe_code`, `float_cmp`, and `panic` are set to
# "deny" directly since a hot-path execution lane has no legitimate use
# for any of the three.
#
# `uuid` added for client-order-ID / idempotency-key generation in the
# hot-path submission logic — this crate did not previously depend on it.

[dependencies]
omega-core = { path = "../omega-core" }
omega-risk = { path = "../omega-risk" }

# EVM primitive types — blueprint_hash (B256), U256 profit arithmetic
alloy-primitives = { workspace = true }

# Async runtime — HotPathGate runs on a Tokio task receiving blueprints
# from a channel; MicrotxSimulator::run is async to yield between batches
tokio = { workspace = true }

# Error handling
anyhow    = { workspace = true }
thiserror = { workspace = true }

# Serialisation — HotPathMetrics snapshot for observability
serde      = { workspace = true }
serde_json = { workspace = true }

# Telemetry
tracing = { workspace = true }

# Timestamps
chrono = { workspace = true }

# Lock-free metrics counters — read from observability without locking
arc-swap = { workspace = true }

# Idempotency / client order IDs for hot-path submission dedup
uuid = { workspace = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# See this file's audit note above: "warn" until an explicit sweep of
# existing unwrap/expect call sites in this crate is done and the deny
# can be turned on without breaking an unreviewed baseline.
unwrap_used = "warn"
expect_used = "warn"
float_cmp   = "deny"
panic       = "deny"