# crates/omega-manifest-gen/Cargo.toml
[package]
name = "omega-manifest-gen"
version = "0.1.0"
edition = "2021"
publish = false
description = """
C4-A tooling: generates config/deployment_manifest.toml from REAL,
live-chain-verified data (eth_getCode -> keccak256), never from
fabricated or guessed addresses/hashes. See src/main.rs module doc
comment for full design and — importantly — the list of assumptions
about omega_security's manifest TOML shape that must be checked against
the real crates/omega-security/src/integrity.rs before this is trusted
in production.
"""

[[bin]]
name = "gen-manifest"
path = "src/main.rs"

[dependencies]
# omega-rpc is the ONLY crate in the workspace permitted to use the full
# alloy transport stack (providers, transports-ws, pubsub) — see that
# crate's own lib.rs "Architectural role (§22.1)" doc comment. This tool
# respects that boundary: it depends on omega-rpc for the one thing it
# needs from the chain (a real eth_getCode read via
# OmegaRpcClient::get_or_connect()'s already-public Arc<dyn Provider>),
# rather than pulling in alloy-provider/alloy-transport-ws directly.
omega-rpc = { path = "../omega-rpc" }

# Fix (this revision): alloy-primitives now resolves via the workspace's
# own pin, not a second, independent direct pin — see below.
#
# ROOT CAUSE, confirmed via real `cargo build --workspace --release` /
# `cargo check --workspace` / `cargo test --workspace` output this
# session (E0308, "expected `alloy_primitives::bits::address::Address`
# ... found `alloy_primitives::Address`", plus the compiler's own
# "multiple different versions of crate `alloy_primitives`" note citing
# BOTH 0.7.7 and 0.8.26 in the dependency graph): this file previously
# pinned `alloy-primitives = { version = "0.7", features = ["serde"] }`
# directly — flagged as an unverified guess in this file's own prior
# header comment ("consistent with chainlink_agg.rs's own comment
# referencing alloy-network-0.3.6 ... but not cross-checked against a
# real Cargo.lock"). That guess was wrong, and it reproduced the EXACT
# same class of bug the root workspace Cargo.toml's own multi-revision
# "Fix (this revision, 4)" / "Fix (this revision, 7)" history already
# fought through and resolved for the rest of the workspace: `Address`
# arriving via this crate's own direct 0.7.x pin is a structurally
# different Rust type than the `Address` `alloy-provider-0.3.6`'s
# `Provider::get_code_at` expects (which resolves through the
# workspace's `alloy = "0.3"` facade dependency to alloy-primitives
# 0.8.26 — see the root Cargo.toml's own "Fix (this revision, 7)" note,
# confirmed there via real `cargo tree -i -p alloy-primitives@<version>`
# output), even though both wrap the same 20 bytes.
#
# Fixed the same way every other workspace member already avoids this:
# `{ workspace = true }`, resolving to whatever
# `[workspace.dependencies].alloy-primitives` pins in the root
# Cargo.toml (currently "0.8", features = ["serde"] — matching what
# `alloy` 0.3.6 actually requires internally). This crate no longer
# maintains its own independent version number for this dependency at
# all, which is what actually prevents this class of bug from
# recurring — not just picking the "right" number once, but removing
# the second source of truth that let it drift in the first place.
alloy-primitives = { workspace = true }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"

# ── NOT VERIFIED against the real workspace ─────────────────────────────
#
# `alloy-primitives`'s version is now resolved via the workspace pin
# (see the fix note above) rather than guessed independently — that
# part of the original concern is closed.
#
# Still NOT independently verified against this workspace's real
# Cargo.lock as of this revision:
#   - `clap`/`serde`/`serde_json`/`toml`/`tokio`/`tracing`/
#     `tracing-subscriber`/`hex` versions here are reasonable current
#     majors, not pinned against — or switched to `{ workspace = true }`
#     for — whatever the rest of the workspace already resolves. Every
#     one of these already appears in the root Cargo.toml's own
#     `[workspace.dependencies]` table (`clap`, `serde`, `serde_json`,
#     `toml` is used directly at "0.8" by the omega-engine binary
#     itself, `tokio`, `tracing`, `tracing-subscriber`) — switching this
#     crate's matching entries to `{ workspace = true }` would very
#     likely be the more correct fix, for the same "remove the second
#     source of truth" reason the alloy-primitives fix above gives, but
#     that has NOT been done here and needs the same real
#     `cargo build`/`cargo check` verification pass this file's alloy-
#     primitives fix just went through — do not assume these are
#     conflict-free just because the one confirmed conflict is now
#     fixed.
#   - `anyhow`/`hex` are also `[workspace.dependencies]` entries
