#     carry the same "should probably be `{ workspace = true }`, not
#     independently re-verified" caveat.
# Run `cargo build --workspace` (already required after this fix
# regardless, to confirm the E0308 is actually resolved) and watch for
# any FURTHER "multiple different versions of crate X" notes on any of
# these — that is the real verification step, not this comment.