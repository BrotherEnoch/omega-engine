// ops/control-plane/proto/omega_control.proto
//
// OmegaControl gRPC service — internal observability and command interface.
//
// Transport: plaintext gRPC on :50051 (TLS terminated at the sidecar).
// Authentication: Bearer token in `authorization` metadata key.
//
// Command governance:
//   PauseStrategy, ResumeStrategy, ClearHalt — L2 fast-approve required.
//   AdjustRollout                             — L2 fast-approve required.
//   All Get* RPCs                             — L1 (Bearer token only).
//
// ## Recovery + audit-alignment note (this revision)
//
// This file was found overwritten with Rust source (a prost-derive
// mirror crate's contents) instead of protobuf syntax, which is why
// `protoc` failed with cascading "Expected top-level statement" errors.
// Recovered from `git show d0ca6736:ops/control-plane/proto/omega_control.proto`
// — the last commit before the file was clobbered — with the service
// definition, package name, and per-field comments restored exactly as
// they were there. See `git log --oneline -- ops/control-plane/proto/omega_control.proto`
// to confirm 0c2d4969 (this repo's most recent commit) is the one that
// did the clobbering.
//
// Three message-shape changes are applied on top of that recovered
// baseline, matching the CHANGES already documented in this codebase's
// Rust mirror crate (the same file that ended up here by mistake) for
// this same commit:
//   1. `generated_at` / `timestamp`: `string` (RFC-3339) -> `google.
//      protobuf.Timestamp`. The prior bare string had no format
//      guarantee; the Rust-side control-plane code already uses a real
//      typed timestamp for the same conceptual data elsewhere.
//   2. `RolloutTier.fraction: double` -> `RolloutTier.rollout_bps:
//      uint32`. A raw [0.0, 1.0] fraction is one typo (0.10 vs 1.0) from
//      meaning 10% vs 100% rollout; basis points match the
//      `DAO_FEE_BPS` integer convention already used elsewhere in this
//      system.
//   3. `microtx_slots`, `normal_slots`, `zk_queue_depth`,
//      `relay_queue_depth`, `sample_count`: signed -> unsigned. None can
//      ever be negative; the signed types allowed representing an
//      illegal state. NOT wire-breaking on its own (protobuf's
//      int32/uint32 and int64/uint64 encode identically for
//      non-negative values).
//
// These three changes are WIRE-FORMAT-BREAKING for (1) and (2) — any
// existing client/server built against the pre-audit .proto will not
// interoperate with this version until rebuilt from it. Confirm nothing
// external to this workspace depends on the old wire format before
// deploying.

syntax = "proto3";
package omega;

import "google/protobuf/timestamp.proto";

service OmegaControl {
  // ── Observability ─────────────────────────────────────────────────────────
  // Point-in-time health snapshot across all 16 layers.
  rpc GetSystemHealth  (Empty)        returns (HealthReport);
  // Server-streaming health events — caller receives one event per FSM
  // transition.  Stream runs until the client cancels.
  rpc WatchHealth      (Empty)        returns (stream HealthEvent);
  // Net-profit breakdown for a strategy / chain combination (§15).
  rpc GetPnL           (PnLRequest)   returns (PnLReport);
  // Per-layer p50/p95/p99 latency vs budget (§4).
  rpc GetLatency       (Empty)        returns (LatencyReport);
  // Microtx / normal / ZK / relay queue depths.
  rpc GetQueueDepths   (Empty)        returns (QueueReport);
  // Per-relay, per-strategy 24h win rates (§relay_la_metrics).
  rpc GetWinRates      (Empty)        returns (WinRateReport);

  // ── Commands (L2 fast-approve required) ──────────────────────────────────
  // Pause a strategy (no new blueprints produced; in-flight allowed to settle).
  rpc PauseStrategy    (StrategyId)   returns (CommandResult);
  // Resume a previously paused strategy.
  rpc ResumeStrategy   (StrategyId)   returns (CommandResult);
  // Clear the halt flag on a specific layer after governance review (§3).
  rpc ClearHalt        (LayerIdMsg)   returns (CommandResult);
  // Adjust the EV-weighted rollout tier (§19).
  rpc AdjustRollout    (RolloutTier)  returns (CommandResult);
}

// ── Shared ────────────────────────────────────────────────────────────────────
message Empty {}

message CommandResult {
  bool   ok      = 1;
  string message = 2;
}

// ── Health ────────────────────────────────────────────────────────────────────
message HealthReport {
  repeated LayerHealth layers        = 1;
  bool                 system_halted = 2;
  // Was `string generated_at` (RFC-3339 UTC) — see this file's
  // module-level audit-alignment note, change 1.
  google.protobuf.Timestamp generated_at = 3;
}

message LayerHealth {
  string layer_id = 1;  // canonical snake_case (§LayerId::Display)
  string state    = 2;  // "HEALTHY" | "DEGRADED" | "HALTED"
  string reason   = 3;  // last set_state reason, or "" if Healthy
}

message HealthEvent {
  string layer_id  = 1;
  string from      = 2;
  string to        = 3;
  string reason    = 4;
  // Was `string timestamp` (RFC-3339 UTC) — see this file's
  // module-level audit-alignment note, change 1.
  google.protobuf.Timestamp timestamp = 5;
}

// ── PnL ───────────────────────────────────────────────────────────────────────
message PnLRequest {
  string chain_id    = 1;  // "42161" | "1" | "8453"
  string strategy_id = 2;  // "SA" | "MSA" | "LA" | "MEV" | "" (all)
}

message PnLReport {
  double gross_profit_eth = 1;
  double gas_cost_eth     = 2;
  double net_profit_eth   = 3;
  double dao_fee_eth      = 4;   // 5% of net (§15.1)
  double pil_share_eth    = 5;   // 95% of net
  string period           = 6;   // "24h" | "7d" | "30d"
}

// ── Latency ───────────────────────────────────────────────────────────────────
message LatencyReport {
  repeated LayerLatency layers = 1;
}

message LayerLatency {
  string layer_id  = 1;
  double p50_us    = 2;
  double p95_us    = 3;
  double p99_us    = 4;
  double budget_us = 5;  // SLA budget; >budget means this layer is over-latency
}

// ── Queue depths ──────────────────────────────────────────────────────────────
message QueueReport {
  // Were int32 — see this file's module-level audit-alignment note,
  // change 3. None of these four can ever be negative.
  uint32 microtx_slots     = 1;  // available Microtx execution slots (§4)
  uint32 normal_slots      = 2;  // available Normal execution slots
  uint32 zk_queue_depth    = 3;  // pending ZK proof requests
  uint32 relay_queue_depth = 4;  // bundles awaiting relay submission
}

// ── Win rates ─────────────────────────────────────────────────────────────────
message WinRateReport {
  repeated RelayWinRate relays = 1;
}

message RelayWinRate {
  string relay        = 1;
  string strategy     = 2;  // "SA" | "MSA" | "LA" | "MEV"
  string chain        = 3;  // "arbitrum" | "ethereum" | "base"
  double rate_24h      = 4;  // [0.0, 1.0]
  // Was int64 — see this file's module-level audit-alignment note,
  // change 3. Can never be negative.
  uint64 sample_count = 5;
}

// ── Commands ──────────────────────────────────────────────────────────────────
message StrategyId {
  string id = 1;  // "SA" | "MSA" | "LA" | "MEV" | "CNRY"
}

message LayerIdMsg {
  string id = 1;  // canonical snake_case LayerId (§LayerId::Display)
}

message RolloutTier {
  // Basis points, 0-10000 (0%-100%). Was `double fraction` in [0.0, 1.0]
  // — see this file's module-level audit-alignment note, change 2.
  uint32 rollout_bps = 1;
}
