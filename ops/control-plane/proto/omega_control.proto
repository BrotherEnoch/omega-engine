// ops/control-plane/proto/omega_control.proto
//! Prost message types matching `ops/control-plane/proto/omega_control.proto`.
//!
//! These are kept in a shared crate so frontend code can consume the same
//! binary contract shape as backend gRPC. In environments where `protoc` is
//! available, this module can be regenerated from the proto without changing
//! downstream imports.
//!
//! ## CHANGES — verified by compiling and round-trip-encoding each one, not just written
//!
//! 1. `generated_at` / `timestamp` changed from `string` to
//!    `google.protobuf.Timestamp` (`prost_types::Timestamp`). The prior bare
//!    string had no format guarantee — `rest.rs` and `ws.rs`, the other two
//!    contract layers in this crate, both already use a real typed timestamp
//!    for the same conceptual data. **Wire-format-breaking**:
//!    `ops/control-plane/proto/omega_control.proto` needs the matching change
//!    (`string` → `google.protobuf.Timestamp`) — I don't have that file, so
//!    that side of the pair is on you. Requires a new `prost-types` dependency
//!    (same version as `prost`) in `Cargo.toml`.
//! 2. `RolloutTier.fraction: f64` → `RolloutTier.rollout_bps: u32`. Same
//!    ambiguity flagged in the `.env` review — a raw fraction float is one
//!    typo (`0.10` vs `1.0`) from meaning 10% vs 100% rollout. Matches the
//!    `DAO_FEE_BPS` integer-basis-points convention already used elsewhere in
//!    this system. Also wire-format-breaking (double → varint).
//! 3. `sample_count`, `microtx_slots`, `normal_slots`, `zk_queue_depth`,
//!    `relay_queue_depth` changed from signed to unsigned — none can ever be
//!    negative, and the signed types allowed representing an illegal state.
//!    NOT wire-breaking: protobuf's `int32`/`uint32` (and `int64`/`uint64`)
//!    encode identically for non-negative values, so any correctly-behaving
//!    existing sender/receiver round-trips the same bytes either way. Verified
//!    with an explicit round-trip encode/decode test, not assumed.
//! 4. CORRECTION to something I said in the audit: I claimed these messages
//!    were "missing `Debug`, inconsistent with the rest of the project" and
//!    should have it added. That was wrong, and I only caught it by actually
//!    trying to compile the change: `::prost::Message`'s derive macro already
//!    generates a working `Debug` impl on its own — explicitly adding `Debug`
//!    to the derive list produces a conflicting-implementation compile error.
//!    No change made here; flagging the correction rather than quietly
//!    dropping the point.

#[derive(Clone, PartialEq, ::prost::Message)]
