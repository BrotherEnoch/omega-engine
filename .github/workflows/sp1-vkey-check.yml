name: SP1 proof safety gate

on:
  push:
    branches:
      - codex/isolated-sp1-vkey-build
  workflow_dispatch:
    inputs:
      expected_vkey:
        description: Expected PROGRAM_VKEY (bytes32)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sp1-vkey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build SP1 ELF and block unreviewed proof circuit
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Fetch only SP1 source (exclude local environment files and submodules)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/omega-sp1"
          mkdir -p "$source_dir"
          cd "$source_dir"
          git init --quiet --initial-branch=main
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          printf '/sp1-program/**\n!/sp1-program/**/.env\n!/sp1-program/**/.env.*\n' > .git/info/sparse-checkout
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD

      - name: Install Protocol Buffers compiler
        shell: bash
        run: |
          set -euo pipefail
          brew list --versions protobuf >/dev/null 2>&1 || brew install protobuf

      - name: Install pinned SP1 toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L https://sp1.succinct.xyz | bash
          "$HOME/.sp1/bin/sp1up" --token "$GH_TOKEN" --version 6.4.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
          "$HOME/.sp1/bin/cargo-prove" prove --version

      - name: Build guest ELF
        working-directory: ${{ runner.temp }}/omega-sp1/sp1-program/program
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.sp1/bin/cargo-prove" prove build
          test -s ../target/elf-compilation/riscv64im-succinct-zkvm-elf/release/omega-proof-program

      - name: Enforce proof security gate
        working-directory: ${{ runner.temp }}/omega-sp1/sp1-program/program
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'production_proof_path_is_reviewed() -> bool {' src/main.rs; then
            echo "::error::SP1 proof production is intentionally disabled. Do not deploy a vkey until signature authentication and trade-to-proof binding are implemented and reviewed."
            exit 1
          fi

      - name: Derive and compare PROGRAM_VKEY
        working-directory: ${{ runner.temp }}/omega-sp1/sp1-program/program
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VKEY="${{ github.event.inputs.expected_vkey }}"
          [[ "$EXPECTED_VKEY" =~ ^0x[0-9a-fA-F]{64}$ ]]
          vkey_output="$("$HOME/.sp1/bin/cargo-prove" prove vkey --elf ../target/elf-compilation/riscv64im-succinct-zkvm-elf/release/omega-proof-program 2>&1)"
          printf '%s\n' "$vkey_output"
          if ! grep -Eiq "${EXPECTED_VKEY}" <<< "$vkey_output"; then
            echo "PROGRAM_VKEY mismatch" >&2
            exit 1
          fi
          echo "PROGRAM_VKEY matches the supplied bytes32 value"

