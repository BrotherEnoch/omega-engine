# config/default.toml
active_phase = 0

[gas]
l2_buffer_factor            = 1.15
l1_data_buffer_factor       = 1.10
max_priority_fee_gwei       = 500
conservative_fee_fraction   = 0.70
emergency_bundle_enabled    = true
gas_token_enabled           = false
gas_token_min_base_fee_gwei = 80

[ml]
learning_rate                = 0.01
validation_ratio             = 0.20
checkpoint_interval          = 1000
revert_threshold             = 0.05
multiplier_ceiling           = 5.0
multiplier_floor             = 0.30
ceiling_escalation_threshold = 100
checkpoint_retention         = 10
checkpoint_dir               = "C:/var/omega/checkpoints"

[relay]
