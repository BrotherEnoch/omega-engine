cascade_stagger_ms               = 10
cascade_max_relays               = 4
inclusion_rate_tie_band_fraction = 0.05

[vault]
dao_fee_bps          = 500
confirmation_depth   = 12
per_transfer_cap_wei = 9000000000000000000
daily_cap_wei        = 9000000000000000000