{
  // contracts/certora/conf/vault_core.conf
  //
  // Tier A scene: OmegaVault linked against the harness DummyERC20 (profit_token)
  // and MockStarkVerifier (stark_verifier). No Orchestrator, no real flashloan
  // providers -- none of VaultCore.spec's rules call into either.
  //
  // npm/Hardhat layout assumed for @openzeppelin resolution (OmegaVault.sol still
  // imports IERC20/SafeERC20/ReentrancyGuard/AccessControl from there even though
  // this scene links a harness token, not OZ's ERC20, as profit_token itself).
  // If this project resolves @openzeppelin via a Foundry lib/ path instead, change
  // both the "files" entry and the "packages" entry below accordingly -- same
  // fork point as every other conf in this project.
  "files": [
    "contracts/src/OmegaVault.sol",
    "contracts/certora/harness/DummyERC20.sol",
    "contracts/certora/harness/MockStarkVerifier.sol"
  ],
  "verify": "OmegaVault:contracts/certora/specs/VaultCore.spec",
  "link": [
    "OmegaVault:profit_token=DummyERC20",
    "OmegaVault:stark_verifier=MockStarkVerifier"
  ],
  "packages": [
    "@openzeppelin/contracts=node_modules/@openzeppelin/contracts"
  ],
  "solc": "solc8.24",
  "optimistic_loop": true,
  "loop_iter": "3",
  "rule_sanity": "basic",
  "msg": "OmegaVault Tier A: C6 gates, depth monotonicity, C9 fee bounds"
}