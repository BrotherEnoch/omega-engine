# Cargo.toml — Root package + workspace manifest for OmegaEngine v12.
#
# Notes on non-obvious decisions (see git history for full context):
#
# - alloy-primitives is pinned to "0.8" to match what alloy 0.3.6
#   actually requires internally (confirmed via
#   `cargo tree -i -p alloy-primitives`). If you ever see two versions
#   of alloy-primitives in the tree, don't re-guess the pin direction —
#   run `cargo update -p alloy-primitives --precise 0.8.26` or delete
#   Cargo.lock and rebuild, then re-check with `cargo tree -i`.
# - crates/omega-manifest-gen's own Cargo.toml still pins
#   alloy-primitives to "0.7" directly instead of `{ workspace = true }`.
#   Should probably switch to workspace = true, but verify with a real
#   build before changing it.
# - Cargo aliases go in .cargo/config.toml's [alias] section, not here —
#   a [alias] table in this file does nothing.
# - Per-crate lint enforcement (unsafe_code, unwrap_used, expect_used,
#   float_cmp, panic) lives in individual crate manifests
#   (omega-hot-path, omega-risk), not here.
# - [profile.dev] uses debug = 1 (line tables only) instead of the
#   default full debug info, to avoid exhausting disk space when
#   `cargo test --workspace` links a separate debug binary per crate.
#   If failures persist, run `cargo clean` or move target-dir to a
#   drive with more space via .cargo/config.toml.
#
# omega-engine's own [dependencies] table must separately list any
# crate main.rs uses directly (chrono, hex, omega-risk, omega-security,
# omega-relay, omega-execution, etc.) — being a [workspace].members
# entry alone isn't enough for the binary package to see it.

[profile.dev]
debug       = 1
incremental = true

[package]
name        = "omega-engine"
version     = "12.0.0"
edition     = "2021"
default-run = "omega-engine"

[[bin]]
name = "omega-engine"
path = "src/main.rs"

[dependencies]
chrono             = { workspace = true }
tokio              = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
toml               = "0.8"
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hex                = "0.4"

omega-core          = { path = "crates/omega-core" }
omega-health        = { path = "crates/omega-health" }
omega-rpc           = { path = "crates/omega-rpc" }
omega-oracle        = { path = "crates/omega-oracle" }
omega-risk          = { path = "crates/omega-risk" }
omega-dag           = { path = "crates/omega-dag" }
omega-zk            = { path = "crates/omega-zk" }
omega-hot-path      = { path = "crates/omega-hot-path" }
omega-strategies    = { path = "crates/omega-strategies" }
omega-observability = { path = "crates/omega-observability" }
omega-relay         = { path = "crates/omega-relay" }
omega-flashloan     = { path = "crates/omega-flashloan" }
omega-security      = { path = "crates/omega-security" }
omega-execution     = { path = "crates/omega-execution" }

[workspace]
resolver = "2"

members = [
    "crates/omega-core",
    "crates/omega-health",
    "crates/omega-rpc",
    "crates/omega-oracle",
    "crates/omega-security",
    "crates/omega-compliance",
    "crates/omega-risk",
    "crates/omega-dag",
    "crates/omega-zk",
    "crates/omega-flashloan",
    "crates/omega-relay",
    "crates/omega-gas-war",
    "crates/omega-loss-attribution",
    "crates/omega-address-rotation",
    "crates/omega-strategies",
    "crates/omega-cross-chain",
    "crates/omega-hot-path",
    "crates/omega-observability",
    "crates/omega-chaos",
    "crates/omega-prl",
    "crates/omega-execution",
    "crates/omega-simulation",
    "crates/omega-testnet",
    "crates/omega-control-contracts",
    "crates/omega-frontend",
    "crates/omega-manifest-gen",
    "ops/control-plane",
    "ops/shadow",
    "ops/backtest",
    "ops/calibrate",
]

[workspace.dependencies]

tokio              = { version = "1",   features = ["full"] }
futures            = "0.3"
async-trait        = "0.1"
tokio-stream       = "0.1"

# alloy 0.3 — do NOT set default-features = false; it suppresses
# transport-ws/pubsub feature declarations in omega-rpc, causing
# "No transports enabled" / "invalid URL scheme: wss" at runtime.
alloy              = { version = "0.3", features = ["serde", "providers", "transport-ws", "pubsub", "rpc-types", "rpc-types-eth"] }
alloy-primitives   = { version = "0.8", features = ["serde"] }
alloy-sol-types    = { version = "0.8" }
revm               = { version = "8",   features = ["serde"] }
serde              = { version = "1",   features = ["derive"] }
serde_json         = "1"
bincode            = "1"
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dashmap            = "5"
indexmap           = "2"
petgraph           = { version = "0.6", features = ["serde-1"] }
priority-queue     = "1"
crossbeam-channel  = "0.5"
arc-swap           = "1"
loom               = "0.7"
chrono             = { version = "0.4", features = ["serde"] }
uuid               = { version = "1",   features = ["v4", "serde"] }
rand               = "0.8"
axum               = { version = "0.7", features = ["ws", "macros"] }
tower              = "0.4"
tower-http         = "0.5"
tonic              = "0.11"
clap               = { version = "4",   features = ["derive", "env"] }
deadpool           = { version = "0.10", features = ["rt_tokio_1"] }