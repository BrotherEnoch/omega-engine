# sp1-program/script/Cargo.toml
[package]
name = "omega-proof-script"
version = "0.1.0"
edition = "2021"

[dependencies]
# SP1 SDK is used only to derive the verification key; this binary cannot prove.
sp1-sdk = { version = "6", features = ["blocking"] }
hex = "0.4"
clap = { version = "4", features = ["derive"] }

